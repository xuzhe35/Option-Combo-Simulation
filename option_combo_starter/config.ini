[tws]
host = 10.3.10.253
port = 7496
client_id = 999

[server]
ws_host = 0.0.0.0
ws_port = 8765
max_ws_message_bytes = 8388608

[yield_curve]
data_dir = /app/state/yield_curve
auto_update_if_missing = false
auto_update_if_stale = false

[portfolio_store]
; Container: the workspace database must live on the persistent volume
; (same mount as yield_curve state), never in the image filesystem.
; NOTE: v1 persistence answers loopback clients only; browsers reaching a
; container over the network get store_unavailable until an authenticated
; remote mode exists.
enabled = true
db_path = /app/state/portfolio_store/portfolio.db
max_payload_bytes = 5242880
